[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crane-statics"
version = "0.1.0"
description = "Desktop engineering application for crane statics analysis"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "pydantic>=2.0.0",
    "pydantic-core>=2.0.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.5.0",
    "jsonschema>=4.23.0",
    "types-PyYAML>=6.0.1",
    "code-review-graph>=2.3.9",
]

[project.scripts]
crane-statics = "crane_statics.qml_app.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crane_statics = [
    "schemas/*.json",
    "qml_app/qml/**/*.qml",
    "qml_app/qml/**/qmldir",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "crane_statics.core.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "crane_statics.calculation.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "crane_statics.data.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=crane_statics --cov-report=term-missing --cov-report=lcov:lcov.info"

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__", "build", "dist"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
